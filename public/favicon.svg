<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    {/* Subtle enterprise metallic gradient for dark squircle */}
    <linearGradient id="dealenzSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14161C" />
      <stop offset="100%" stopColor="#050608" />
    </linearGradient>

    {/* Precision amber focal highlight */}
    <linearGradient id="amberFocusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
  </defs>

  {/* Outer Pitch Black Squircle Frame */}
  <rect
    x="2"
    y="2"
    width="124"
    height="124"
    rx="30"
    fill="url(#dealenzSquircleGrad)"
    stroke="rgba(255, 255, 255, 0.15)"
    strokeWidth="2"
  />

  {/* Architectural Enterprise "D-Lens" Monogram */}
  {/* 1. Grounded Institutional Spine (Vertical Pillar) */}
  <rect x="28" y="28" width="13" height="72" rx="4" fill="#FFFFFF" />

  {/* 2. Precision Outer D-Arc (Contract Boundary) */}
  <path
    d="M 45 28 H 72 C 93 28, 106 43, 106 64 C 106 85, 93 100, 72 100 H 45 V 86 H 71 C 84 86, 92 76, 92 64 C 92 52, 84 42, 71 42 H 45 Z"
    fill="#FFFFFF"
  />

  {/* 3. Optical Scrutiny Lens / Viewfinder Reticle inside Counter */}
  <path
    d="M 58 48 C 72 52, 80 64, 80 64 C 80 64, 72 76, 58 80 C 64 74, 67 64, 67 64 C 67 64, 64 54, 58 48 Z"
    fill="#FFFFFF"
    fillOpacity="0.35"
  />

  {/* 4. Center Micro-Focus Diamond (Strategic Intelligence Center) */}
  <polygon
    points="67,59 72,64 67,69 62,64"
    fill="url(#amberFocusGrad)"
  />
</svg>
